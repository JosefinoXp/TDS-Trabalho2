services:
  app:
    build:
      context: .
      target: dev
    # Mapeia a porta 8080 do Windows para a 5173 do container
    ports:
      - "8080:5173"
    # Sincroniza os arquivos
    volumes:
      - .:/app
      - /app/node_modules
    # Garante que o servidor aceite conexões externas
    command: npm run dev -- --host